<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211b39"><title>PLUMECRAFT — The English Writing Quest</title><style>
:root{font-family:Georgia,serif;color:#fff3d4;background:#16152a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#13132a99,#13132abb),url('assets/bg-pc.webp') center/cover fixed}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #ffdc72;outline-offset:3px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 18px;background:#171429dc;border-bottom:2px solid #c99544;position:sticky;top:0;z-index:5;flex-wrap:wrap}.brand{font-size:clamp(23px,3.2vw,42px);font-weight:900;color:#ffd77d;text-shadow:2px 3px #542b38;letter-spacing:2px}.brand small{display:block;font-size:11px;letter-spacing:1px;text-align:center;color:#fff2d5}.stats{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-family:system-ui;font-size:13px}.meter{width:115px;height:10px;background:#322943;border:1px solid #c29b52;border-radius:20px;overflow:hidden}.meter span{display:block;height:100%;background:linear-gradient(90deg,#3fb9e9,#f2d260)}.shell{max-width:1120px;margin:auto;padding:22px 18px 60px}.home{min-height:calc(100dvh - 85px);display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding:24px 5% 65px}.home-title{text-align:center;width:min(520px,100%);font-size:clamp(38px,6vw,75px);font-weight:900;color:#ffda85;line-height:1;text-shadow:3px 5px #5a2a31,-2px -2px #6a391c,0 0 16px #371329}.home-title span{display:block;font-size:clamp(15px,2vw,23px);margin:12px 0 24px;color:#fff2cc;letter-spacing:1px}.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:min(570px,100%)}.tile{border:0;background:transparent;padding:0;transition:transform .15s,filter .15s}.tile:hover{transform:scale(1.055);filter:brightness(1.15)}.tile img{display:block;width:100%;height:auto}.panel{background:linear-gradient(145deg,#28213ded,#17162de9);border:3px solid #c28c44;border-radius:16px;box-shadow:0 8px 0 #100e20,0 15px 40px #0008;padding:22px;margin-bottom:20px}.panel h1,.panel h2{color:#ffd58b;margin:0 0 15px}.panel h1{font-size:clamp(27px,4vw,40px)}.panel p,.panel li{font-family:system-ui;line-height:1.6}.back,.gold,.smallbtn{border:2px solid #edc57b;background:linear-gradient(#875032,#4e2c2b);color:#fff5d7;border-radius:9px;padding:11px 17px;font-weight:bold;box-shadow:0 3px #241421}.gold{background:linear-gradient(#f5c66a,#ab692e);color:#271d27}.smallbtn{padding:7px 12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.quest{border:2px solid #aa864d;background:#372b45;border-radius:12px;padding:17px}.quest h3{margin:0 0 8px;color:#ffda83}.tag{display:inline-block;border-radius:7px;background:#5d4b7b;padding:3px 9px;font:700 12px system-ui;margin:4px}.tag.a1{background:#357b4a}.tag.a2{background:#39769a}.tag.b1{background:#854a91}textarea,input,select{width:100%;border:2px solid #b58c5b;background:#fff9e8;color:#292236;border-radius:8px;padding:12px;font:16px/1.55 system-ui}textarea{min-height:270px;resize:vertical}.editor{display:grid;grid-template-columns:minmax(210px,1fr) minmax(0,2fr);gap:17px}.hint{background:#4b3d57;border-left:4px solid #f5ca69;border-radius:8px;padding:12px;font:14px/1.5 system-ui;margin:10px 0}.words{display:flex;gap:7px;flex-wrap:wrap}.words button{background:#f4dbab;color:#32243b;border:1px solid #8d6636;border-radius:7px;padding:7px 10px}.muted{color:#e1d4c1;font:14px system-ui}.card{border:1px solid #9d7d53;border-radius:10px;background:#352d45;padding:15px;margin:10px 0}.card strong{color:#ffdf96}.result{white-space:pre-wrap;background:#f9efd9;color:#292234;padding:18px;border-radius:10px;font:16px/1.6 system-ui;min-height:70px}.hidden{display:none!important}.footer{text-align:center;padding:15px;font:12px system-ui;color:#d8c6ad}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:13px 20px;border-radius:10px;background:#f3c873;color:#271e31;font:700 14px system-ui;z-index:9;box-shadow:0 5px 20px #0008}.intro{font-family:system-ui;max-width:750px}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.steps span{padding:8px 12px;border-radius:7px;background:#544466;font:700 13px system-ui}.steps .on{background:#d6a45e;color:#211a27}@media(max-width:700px){body{background:linear-gradient(#13132a99,#13132ab5),url('assets/bg-mobile.webp') center/cover fixed}.home{align-items:center;justify-content:flex-start;padding:40px 12px 40px;min-height:calc(100dvh - 80px)}.home-title{font-size:clamp(36px,9vw,58px)}.menu{grid-template-columns:1fr 1fr;gap:4px}.shell{padding:13px 10px 35px}.panel{padding:15px}.editor{grid-template-columns:1fr}.stats{font-size:11px}.top{padding:8px}.brand{font-size:24px}}
</style></head><body><header class="top"><div class="brand" role="button" tabindex="0" onclick="go('home')" onkeydown="if(event.key==='Enter')go('home')">PLUMECRAFT<small>THE ENGLISH WRITING QUEST · by BROT2YOU</small></div><div class="stats"><span id="level">✦ Level 1</span><div class="meter"><span id="xpbar" style="width:0%"></span></div><span id="xp">0 XP</span><span id="coins">🪙 0</span><button class="smallbtn" onclick="toggleSound()" id="sound" aria-label="Toggle sound">🔊</button></div></header><main id="app"></main><footer class="footer">PLUMECRAFT · by BROT2YOU · Your writing stays on this device</footer><div class="toast hidden" id="toast" role="status"></div><script>
const QUESTS=[{id:'friend',level:'A1',title:'A Letter to a Friend',task:'Write a short informal letter to introduce yourself, your hobbies and your family.',prompts:['What is your name?','What do you like doing?','Who is in your family?'],starter:'Hi!\nMy name is ...\nI am ... years old.\nI like ...\nWhat about you?\nSee you soon!',min:45},{id:'town',level:'A1',title:'My Town',task:'Describe your town or neighbourhood.',prompts:['Where do you live?','What places are there?','What do you like about it?'],starter:'I live in ...\nThere is ...\nThere are ...\nI like my town because ...',min:45},{id:'routine',level:'A1',title:'A Day in My Life',task:'Describe your daily routine and say what you enjoy.',prompts:['When do you get up?','What do you do after school?','What is your favourite moment?'],starter:'Every day, I ...\nAfter school, I ...\nMy favourite moment is ...',min:55},{id:'holiday',level:'A2',title:'My Dream Holiday',task:'Describe your ideal holiday with activities and reasons.',prompts:['Where would you go?','What would you do?','Why?'],starter:'I would like to visit ...\nFirst, I would ...\nI would also ... because ...',min:75},{id:'review',level:'A2',title:'A Film Review',task:'Write a short review of a film or book. Give your opinion and reasons.',prompts:['What is it about?','Who are the main characters?','Would you recommend it?'],starter:'I recently watched/read ...\nIt is about ...\nIn my opinion, ...\nI recommend it because ...',min:85},{id:'mystery',level:'B1',title:'A Mysterious Story',task:'Write a short mystery with a beginning, a problem and an ending.',prompts:['Where and when does the story begin?','What unexpected event happens?','How does it end?'],starter:'It was a dark evening when ...\nSuddenly, ...\nAlthough ..., ...\nIn the end, ...',min:110},{id:'opinion',level:'B1',title:'Should Schools Have Uniforms?',task:'Present an opinion with arguments, examples and a conclusion.',prompts:['What is your opinion?','Can you give two reasons?','What might others think?'],starter:'In my opinion, ...\nFirstly, ...\nFor example, ...\nHowever, ...\nTo conclude, ...',min:120}];
const WORDS={Connectors:['and','but','because','so','however','although','firstly','moreover','finally','for example','in conclusion'],Opinions:['I think that','In my opinion','I believe that','I prefer','I agree because','On the other hand'],Descriptions:['beautiful','lively','peaceful','crowded','exciting','interesting','colourful','friendly'],Stories:['Once upon a time','Suddenly','While','A few minutes later','To my surprise','In the end'],Letters:['Dear','Hi!','How are you?','I am writing to','Best wishes','See you soon']};
const KEY='plumecraft_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{xp:0,coins:0,done:[],texts:[],drafts:{},sound:true}}catch{state={xp:0,coins:0,done:[],texts:[],drafts:{},sound:true}};let current='home',selected='town',draft='',editorTitle='',stage=1,filter='All',category='Connectors';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){localStorage.setItem(KEY,JSON.stringify(state));stats()}function stats(){let lv=Math.floor(state.xp/250)+1;$('level').textContent='✦ Level '+lv;$('xp').textContent=state.xp+' XP';$('coins').textContent='🪙 '+state.coins;$('xpbar').style.width=(state.xp%250)/250*100+'%';$('sound').textContent=state.sound?'🔊':'🔇'}function tone(){if(!state.sound)return;try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(540,a.currentTime);o.frequency.exponentialRampToValueAtTime(780,a.currentTime+.09);g.gain.setValueAtTime(.035,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.13)}catch{}}function toggleSound(){state.sound=!state.sound;persist();tone()}function notify(msg){$('toast').textContent=msg;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2400)}function shell(title,body){$('app').innerHTML='<div class="shell"><button class="back" onclick="go(\'home\')">← Home</button><section class="panel" style="margin-top:15px"><h1>'+title+'</h1>'+body+'</section></div>'}function go(page){tone();current=page;if(page==='home')home();if(page==='missions')missions();if(page==='workshop')workshop();if(page==='grimoire')grimoire();if(page==='forge')forge();if(page==='corrector')corrector();if(page==='library')library();window.scrollTo(0,0)}function home(){$('app').innerHTML='<div class="home"><div class="home-title">PLUMECRAFT<span>THE ENGLISH WRITING QUEST</span></div><nav class="menu" aria-label="Main menu">'+['workshop','grimoire','missions','forge','corrector','library'].map(k=>'<button class="tile" onclick="go(\''+k+'\')" aria-label="'+k+'"><img src="assets/'+k+'.png" alt="'+k+'"></button>').join('')+'</nav></div>'}
function missions(){shell('🗺️ The Missions','<p class="intro">Choose a writing quest. Start at A1 and build your skills towards B1.</p><div class="actions">'+['All','A1','A2','B1'].map(l=>'<button class="smallbtn" onclick="filter=\''+l+'\';missions()">'+l+'</button>').join('')+'</div><div class="grid">'+QUESTS.filter(q=>filter==='All'||q.level===filter).map(q=>'<div class="quest"><span class="tag '+q.level.toLowerCase()+'">'+q.level+'</span> '+(state.done.includes(q.id)?'⭐ Completed':'✧ New quest')+'<h3>'+esc(q.title)+'</h3><p>'+esc(q.task)+'</p><p class="muted">Suggested target: '+q.min+' words</p><button class="gold" onclick="startQuest(\''+q.id+'\')">Start quest →</button></div>').join('')+'</div>')}
function startQuest(id){selected=id;stage=1;draft=state.drafts[id]??'';editorTitle=QUESTS.find(q=>q.id===id).title;go('workshop')}
function workshop(){let q=QUESTS.find(q=>q.id===selected)||QUESTS[0];shell('✒️ The Workshop','<p class="intro">Plan, write and improve your text. Your draft is saved automatically on this device.</p><div class="steps"><span class="'+(stage===1?'on':'')+'">1 · Plan</span><span class="'+(stage===2?'on':'')+'">2 · Write</span><span class="'+(stage===3?'on':'')+'">3 · Improve</span></div><div class="editor"><aside><label for="questSelect">Writing mission</label><select id="questSelect" onchange="changeQuest(this.value)">'+QUESTS.map(x=>'<option value="'+x.id+'" '+(x.id===selected?'selected':'')+'>'+esc(x.title)+'</option>').join('')+'</select><div class="hint"><strong>Your task</strong><p>'+esc(q.task)+'</p></div><div class="hint"><strong>Plan your ideas</strong><ol>'+q.prompts.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ol></div><div class="hint"><strong>Useful expressions</strong><div class="words">'+['because','but','also','for example','firstly','finally'].map(w=>'<button onclick="insertWord(\''+w+'\')">'+w+'</button>').join('')+'</div></div><button class="smallbtn" onclick="addStarter()">✨ Insert a writing starter</button></aside><div><label for="draft">Your text · <span id="count">0</span> words (suggested: '+q.min+')</label><textarea id="draft" spellcheck="true" placeholder="Your writing adventure begins here..." oninput="updateDraft()">'+esc(draft)+'</textarea><div class="actions"><button class="gold" onclick="stage=2;updateDraft();notify(\'Keep writing!\')">Write</button><button class="gold" onclick="saveText()">💾 Save to Library</button><button class="smallbtn" onclick="stage=3;go(\'forge\')">✨ Improve in the Forge</button><button class="smallbtn" onclick="go(\'corrector\')">🔎 Check my text</button></div><p class="muted">The writing tools provide guidance and examples; they do not automatically grade your English.</p></div></div>');$('count').textContent=wordCount(draft)}
function changeQuest(id){updateDraft();selected=id;draft=state.drafts[id]??'';stage=1;workshop()}function wordCount(s){return(s.trim().match(/\b[\wÀ-ÿ'-]+\b/g)||[]).length}function updateDraft(){if(!$('draft'))return;draft=$('draft').value;state.drafts[selected]=draft;persist();if($('count'))$('count').textContent=wordCount(draft)}function insertWord(w){let t=$('draft');let p=t.selectionStart; t.value=t.value.slice(0,p)+(p?' ':'')+w+' '+t.value.slice(p);t.focus();t.setSelectionRange(p+w.length+2,p+w.length+2);updateDraft()}function addStarter(){let q=QUESTS.find(q=>q.id===selected);if(draft.trim()&&!confirm('Append the writing starter to your text?'))return;draft+=(draft?'\n\n':'')+q.starter;state.drafts[selected]=draft;persist();workshop()}
function saveText(){updateDraft();if(!draft.trim()){notify('Write something before saving.');return}let q=QUESTS.find(q=>q.id===selected);state.texts.unshift({id:Date.now(),quest:selected,title:q.title,level:q.level,body:draft,date:new Date().toISOString()});if(!state.done.includes(selected)){state.done.push(selected);state.xp+=40;state.coins+=10;notify('Quest saved! +40 XP · +10 coins')}else notify('New version saved in your Library');persist()}
function grimoire(){shell('📖 The Grimoire','<p class="intro">Useful language to help you write more clearly and creatively. Tap an expression to copy it.</p><div class="actions">'+Object.keys(WORDS).map(c=>'<button class="smallbtn" onclick="category=\''+c+'\';grimoire()">'+c+'</button>').join('')+'</div><h2>'+category+'</h2><div class="grid">'+WORDS[category].map(w=>'<button class="quest" style="color:#fff4d6;text-align:left;font-size:18px" onclick="copyText(\''+w.replaceAll("'","\\'")+'\')">✦ '+esc(w)+'</button>').join('')+'</div><p class="muted">Tip: use expressions naturally, not just to make a text longer.</p>')}
function copyText(s){navigator.clipboard?.writeText(s).then(()=>notify('Copied: '+s)).catch(()=>notify(s))}
function getText(){return state.drafts[selected]||draft||''}function forge(){let t=getText();let tips=[];if(wordCount(t)<50)tips.push('Add a concrete detail or example to develop your ideas.');if(!/\bbecause\b/i.test(t))tips.push('Explain a reason using because.');if(!/\b(but|however|although)\b/i.test(t))tips.push('Consider adding a contrast with but or however.');if(!/\b(first|firstly|then|finally|in the end)\b/i.test(t))tips.push('Organise your ideas with sequencing words.');if(tips.length===0)tips.push('Good variety of linking words. Check that every sentence supports your main idea.');shell('⚒️ The Forge','<p class="intro">Make your text stronger with targeted writing strategies.</p><div class="grid"><div class="card"><strong>Your current draft</strong><div class="result">'+esc(t||'Start a draft in The Workshop to see it here.')+'</div></div><div class="card"><strong>Ideas for improvement</strong>'+tips.map(x=>'<div class="hint">⭐ '+esc(x)+'</div>').join('')+'<div class="hint"><strong>Example transformation</strong><p>Before: My town is nice. There are shops.</p><p>After: My town is lively because there are several shops and a beautiful park.</p></div></div></div><div class="actions"><button class="gold" onclick="go(\'workshop\')">← Return to my writing</button></div><p class="muted">These are simple rule-based suggestions, not an automatic rewrite or CEFR assessment.</p>')}
function corrector(){let t=getText(),tips=[];if(/\bi\b/.test(t))tips.push('The pronoun “I” always takes a capital letter.');if(/\b(he|she|it) (like|play|go|have)\b/i.test(t))tips.push('Check the present simple after he, she or it (e.g. likes, plays, goes, has).');if(/\bthere is (two|three|many|some|several)\b/i.test(t))tips.push('With plural nouns, you usually need “there are”.');if(/\b(a|an) [aeiou]/i.test(t))tips.push('Check a/an before vowel sounds. The sound matters more than the spelling.');if(t&&/^[a-z]/.test(t.trim()))tips.push('Begin your first sentence with a capital letter.');if(t&&!/[.!?][\s"']*$/.test(t.trim()))tips.push('Check punctuation at the end of your text.');if(!tips.length)tips.push('No common patterns detected by this basic checker. Proofread spelling, verb forms and meaning carefully.');shell('🔎 The Corrector','<p class="intro">Spot possible mistakes and learn how to fix them yourself.</p><div class="card"><strong>Your draft</strong><div class="result">'+esc(t||'No draft yet. Write in The Workshop first.')+'</div></div><h2>Things to check</h2>'+tips.map(x=>'<div class="hint">🔍 '+esc(x)+'</div>').join('')+'<button class="gold" onclick="go(\'workshop\')">✒️ Edit my text</button><p class="muted">This basic offline checker is not a full grammar or spelling correction service. Some suggestions may not apply.</p>')}
function library(){shell('📚 The Library','<p class="intro">Your saved writing quests and progress. Everything is stored locally in this browser.</p><div class="grid"><div class="card"><h2>✦ Level '+(Math.floor(state.xp/250)+1)+'</h2><p>'+state.xp+' XP · '+state.coins+' coins</p><p>'+state.done.length+' / '+QUESTS.length+' quests completed</p></div><div class="card"><h2>🏅 Your writing skills</h2><p>Practice writing, vocabulary, organisation and revision through your quests.</p><p class="muted">XP rewards completed quests; it does not measure writing proficiency.</p></div></div><h2>My Texts</h2>'+(state.texts.length?state.texts.map(x=>'<div class="card"><strong>'+esc(x.title)+'</strong> <span class="tag">'+esc(x.level)+'</span><p class="muted">'+new Date(x.date).toLocaleString()+' · '+wordCount(x.body)+' words</p><div class="result">'+esc(x.body)+'</div><div class="actions"><button class="smallbtn" onclick="editSaved('+x.id+')">✒️ Edit copy</button><button class="smallbtn" onclick="deleteSaved('+x.id+')">🗑 Delete</button></div></div>').join(''):'<div class="hint">Your library is empty. Complete your first writing quest!</div>')+'<div class="actions"><button class="gold" onclick="exportData()">⬇ Export my progress</button><label class="smallbtn">⬆ Import progress<input type="file" accept="application/json,.json" onchange="importData(this.files[0])" style="display:none"></label><button class="smallbtn" onclick="resetData()">Reset progress</button></div>')}
function editSaved(id){let x=state.texts.find(t=>t.id===id);if(!x)return;selected=x.quest;draft=x.body;state.drafts[selected]=draft;persist();go('workshop')}function deleteSaved(id){if(!confirm('Delete this saved text?'))return;state.texts=state.texts.filter(x=>x.id!==id);persist();library()}function exportData(){let blob=new Blob([JSON.stringify({app:'PLUMECRAFT',version:1,data:state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='plumecraft-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importData(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(v.app!=='PLUMECRAFT'||!v.data||!Array.isArray(v.data.texts)||!Array.isArray(v.data.done)||typeof v.data.drafts!=='object')throw Error();if(!confirm('Replace the current progress with this backup?'))return;state=v.data;persist();library();notify('Progress imported')}catch{notify('Invalid PLUMECRAFT backup')}};r.readAsText(file)}function resetData(){if(!confirm('Erase all local PLUMECRAFT progress and saved texts?'))return;state={xp:0,coins:0,done:[],texts:[],drafts:{},sound:true};draft='';persist();go('home')}stats();home();
</script></body></html>
